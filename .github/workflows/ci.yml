name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "These Go files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet root module
        run: go vet ./...

      - name: Test root module
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test ./...

      - name: Build current CLI entry
        run: go build -o "$RUNNER_TEMP/reasonix" ./cmd/reasonix

      - name: Install Wails CLI
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Generate Wails frontend bindings
        working-directory: desktop
        run: wails generate module

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: desktop/frontend
        run: pnpm typecheck

      - name: Test frontend
        working-directory: desktop/frontend
        run: pnpm test:all

      - name: Build frontend
        working-directory: desktop/frontend
        run: pnpm build

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Test desktop Go module
        working-directory: desktop
        run: go test ./...
