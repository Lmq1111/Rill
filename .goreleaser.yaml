version: 2
project_name: rillagent

before:
  hooks:
    - go mod download

builds:
  - id: rillagent
    main: ./cmd/rillagent
    binary: rillagent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X reasonix/internal/brand.Version={{ .Version }}
    goos: [darwin]
    goarch: [arm64]

archives:
  - id: rillagent
    ids: [rillagent]
    name_template: "Rillagent-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  prerelease: auto
  make_latest: false
  name_template: "Rill CLI {{ .Tag }}"
